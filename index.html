<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Demo Data</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		:root {
			--font-family: 'Helvetica', Arial, sans-serif;
			--primary-color: hsl(204, 70%, 53%);
			--text-color: hsl(0, 0%, 20%);
			--container-md: 960px;
			--container: 1160px;
			--container-lg: 1400px;
		}

		body {
			color: var(--text-color);
			font-family: var(--font-family);
		}

		.container {
			max-width: var(--container);
			margin: 0 auto;
			padding: 0 1rem;
		}

		.text-center {
			text-align: center;
		}

		.my-12 {
			margin-top: 4rem;
			margin-bottom: 4rem;
		}

		hr {
			border: none;
			border-top: 1px solid var(--primary-color);
			margin: 2rem 0;
		}

		.avatar {
			border-radius: 50%;
			overflow: hidden;
			width: 120px;
			height: 120px;
		}


		.users-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 1rem;
		}

		.card {
			border: 2px solid var(--primary-color);
			border-radius: 0.5rem;
			padding: 1rem;
			font-size: 0.875rem;

			img {
				display: block;
				margin: 0 auto 1rem auto;
				border: 2px solid var(--primary-color);
			}

			h2 {
				font-size: 1.25rem;
				margin-bottom: 0.5rem;
				text-align: center;
			}

			ul.data-list {
				list-style: none;
				padding: 0;
				margin: 0;

				li {
					margin-bottom: .5rem
				}
			}
		}

		.card:hover {
			cursor: pointer;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
			transform: translateY(-4px);
			transition: all 0.3s ease;
		}
	</style>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"
		integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=="
		crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<script>
		$(document).ready(function () {
			$.ajax({
				url: 'json/users.json',
				success: function (data) {
					$.each(data, function (index, value) {
						$('.users-grid').append(`
							<div class="card">
								<img src="${value.avatar}" class="avatar" alt="${value.name}">
								<h2 class="name">${value.name}</h2>
								<ul class="data-list">
									<li>Role: ${value.role}</li>
									<li>Age: ${value.age}</li>
									<li>${value.email}</li>
								</ul>
							</div>
						`);
					});
				}
			});
		});
	</script>
</head>

<body>
	<div class="container">
		<h1 class="text-center my-12">Demo Data</h1>
		<p>This is a simple demonstration of HTML structure for displaying demo data.</p>
		<hr />
		<div class="users-grid"></div>
	</div>
</body>

</html>
